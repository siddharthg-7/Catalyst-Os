# =================================================================
# CatalystOS - Production Multi-Container Deployment Orchestration
# Includes: Nginx Reverse Proxy, Node Gateway (SPA+API), FastAPI AI, PostgreSQL+pgvector
# =================================================================

services:
  nginx:
    image: nginx:alpine
    container_name: catalyst-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      node-gateway:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    container_name: catalyst-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-catalyst_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catalyst_secure_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/migrations/init_pgvector.sql:/docker-entrypoint-initdb.d/01-init_pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalyst_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  fastapi-ai:
    build:
      context: ./backend/py_service
      dockerfile: Dockerfile
    container_name: catalyst-fastapi
    restart: always
    expose:
      - "8000"
    env_file:
      - path: .env
        required: true
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:catalyst_secure_pass@postgres:5432/catalyst_db?schema=public}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-${GEMINI_API_KEY}}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - ENVIRONMENT=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  node-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catalyst-node-gateway
    restart: always
    expose:
      - "3000"
    env_file:
      - path: .env
        required: true
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:catalyst_secure_pass@postgres:5432/catalyst_db?schema=public}
      - DIRECT_URL=${DIRECT_URL:-${DATABASE_URL}}
      - FASTAPI_URL=http://fastapi-ai:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-${GEMINI_API_KEY}}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      fastapi-ai:
        condition: service_healthy

volumes:
  postgres_data:
